<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate_password</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Generate a <br><span>Random Password</span></h1>
        <div class="display">
            <input type="text " id="password" placeholder="Password">
            <img src="1.png" alt="copy" onclick="copyPassword()"  >
        </div>
        <button onclick="createpassword()"><img src="2.png">Generate Password</button>
    </div>
    <script>
    const passwordBox= document.getElementById("password");
    const leght= 12;
    const uppercase = "ABCDEFJHIGKLMKNOPRSTUVWXYZ";
    const lowercase = "abcdefjhigklmnopqrstuvwxyz";
    const number = "0123456789";
    const symbol = "@!#$%^&*()_+=?/<>{}[]"; 
    
    const allcharts = uppercase + lowercase + number + symbol;

    function createpassword(){    
        let password ="";
       /* password += uppercase[Math.floor(Math.random() * uppercase.length)];
        password += lowercase[Math.floor(Math.random() * lowercase.length)];
        password += number[Math.floor(Math.random() * number.length)];
        password += symbol[Math.floor(Math.random() * symbol.length)];*/

        while(leght > password.length ){
           password += allcharts[Math.floor(Math.random() * allcharts.length)];
        }
        passwordBox.value = password;
    }

    function copyPassword(){
        passwordBox.select()
        document.execCommand("copy");
    }

   

   

    </script>
</body>
</html>
